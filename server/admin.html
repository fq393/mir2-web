<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>比奇本地数值管理</title><style>body{max-width:1000px;margin:30px auto;padding:0 20px;background:#151714;color:#e8e2cb;font:15px system-ui}textarea{width:100%;height:52vh;background:#080b09;color:#dbe2d8;box-sizing:border-box;font:13px monospace}button,select{padding:8px;margin:8px 8px 8px 0}p{line-height:1.6}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style><h1>比奇本地数值管理</h1><p>原配置保留为只读基线。这里修改的是本机自定义覆盖，下次重启服务器生效。可调：升级经验、首饰数值、鹿/稻草人属性、刷新位置/范围/数量/分钟周期，以及现有掉落条目的 1/N 分母。暂不支持增加物种、修改素材ID或改写来源记录。</p><select id="profile" aria-label="配置类型"><option value="experience">升级经验</option><option value="jewellery">首饰属性与价格</option><option value="bichon-wildlife">怪物、刷新与掉率</option></select><button id="reload">重新载入</button><button id="preview">预览修改</button><button id="save" disabled>保存自定义配置</button><button id="restore">恢复原始基线</button><p id="status" role="status"></p><textarea id="editor" spellcheck="false" aria-label="数值配置 JSON"></textarea><pre id="diff" aria-label="修改预览"></pre><script>
let etag='',loaded='',original=null,previewed='';let version=0;
const profile=document.getElementById('profile'),editor=document.getElementById('editor'),status=document.getElementById('status'),saveButton=document.getElementById('save'),restoreButton=document.getElementById('restore'),diff=document.getElementById('diff');
async function load(){const current=++version;saveButton.disabled=true;restoreButton.disabled=true;loaded='';diff.textContent='';const r=await fetch('/admin/config/'+profile.value);if(!r.ok)throw Error('读取失败');const d=await r.json();if(current!==version)return;etag=d.etag;loaded=d.name;original=d.content;previewed='';editor.value=JSON.stringify(d.content,null,2);restoreButton.disabled=false;status.textContent=(d.custom?'自定义覆盖':'原始候选基线')+(d.pending?' · 修改待重启生效':' · 当前加载版本');}
profile.onchange=()=>load().catch(e=>status.textContent=e.message);document.getElementById('reload').onclick=profile.onchange;editor.oninput=()=>{saveButton.disabled=true;previewed='';};
document.getElementById('preview').onclick=()=>{try{if(!loaded)throw Error('请等待配置载入');const next=JSON.parse(editor.value),lines=[];function compare(a,b,path){if(JSON.stringify(a)===JSON.stringify(b))return;if(a&&b&&typeof a==='object'&&typeof b==='object'){for(const k of new Set([...Object.keys(a),...Object.keys(b)]))compare(a[k],b[k],path+'/'+k);}else lines.push(path+': '+JSON.stringify(a)+' → '+JSON.stringify(b));}compare(original,next,'');diff.textContent=lines.join('\n')||'未修改';previewed=editor.value;saveButton.disabled=lines.length===0;status.textContent='保存时由服务器验证；预览不代表数值已生效。';}catch(e){status.textContent=e.message;}};
async function save(restore=false){if(!loaded||(!restore&&editor.value!==previewed))return;saveButton.disabled=true;restoreButton.disabled=true;try{const content=restore?original:JSON.parse(editor.value),r=await fetch('/admin/config/'+loaded,{method:'POST',headers:{'Content-Type':'application/json','X-Mir-CSRF':'__CSRF__'},body:JSON.stringify({etag,content,restore})}),d=await r.json();if(r.ok){await load();status.textContent=restore?'已恢复原始基线；重启服务器后生效。':d.message;}else status.textContent=d.message;}catch(e){status.textContent='保存失败：'+e.message;}finally{restoreButton.disabled=!loaded;}}
saveButton.onclick=()=>save();restoreButton.onclick=()=>save(true);load().catch(e=>status.textContent=e.message);
</script></html>
