%;background:white;color:var(--ink);border:1px solid #a8b0a2;border-radius:5px;padding:8px 10px;font-variant-numeric:tabular-nums}input.changed{border-color:#688056;background:#f1f6eb}input[aria-invalid="true"]{border-color:var(--danger);background:#fff6f4}.error{color:var(--danger)!important}.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0}.exp-grid .field{padding:18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;gap:16px;align-items:center;margin:24px 0}.footer{position:fixed;bottom:0;left:224px;right:0;background:var(--paper);border-top:1px solid var(--line);padding:16px 36px;display:flex;justify-content:space-between;gap:16px;align-items:center;z-index:2}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#294532}.danger{color:var(--danger)}#status{max-width:550px;font-size:13px}.sources{margin-top:28px;color:var(--muted);font-size:13px}.sources summary{cursor:pointer;min-height:44px;padding:12px 0}.sources pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:280px;overflow:auto;padding:18px;background:#eeeee6}.source-note{margin-bottom:12px}dialog{border:1px solid var(--line);border-radius:10px;padding:28px;width:min(760px,calc(100% - 32px));max-height:85vh;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#15221ad0}dialog .actions{justify-content:flex-end;margin-top:24px}#changes{max-height:45vh;overflow:auto;margin-top:20px}.change{padding:12px 0;border-bottom:1px solid var(--line)}.change strong{font-size:14px;display:block}.values{font-variant-numeric:tabular-nums;color:var(--muted);display:flex;gap:16px;align-items:center;margin-top:4px}.values b{color:var(--accent)}.sr-only:focus-visible{position:fixed;top:8px;left:8px;width:auto;height:auto;clip:auto;z-index:10;background:white;padding:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){.shell{grid-template-columns:180px minmax(0,1fr)}aside{padding:24px 12px}.content{padding:24px 20px 150px}.topbar{padding:16px 20px}.footer{left:180px;padding:14px 20px;flex-wrap:wrap}.summary>div{padding:14px}.summary strong{font-size:17px}}@media(max-width:600px){.shell{display:block}aside{position:static;height:auto;padding:18px 16px;gap:16px}.brand small,.nav-label,.aside-foot{display:none}nav{grid-template-columns:repeat(3,1fr);gap:4px}nav button{font-size:13px;padding:10px 7px;justify-content:center;gap:5px}nav svg{display:none}.topbar{padding:12px 16px;font-size:12px}.content{padding:24px 16px 190px}h1{font-size:25px}.heading{align-items:flex-start;gap:10px}.heading>button{padding:8px;flex-shrink:0}.summary{margin-top:20px}.summary>div{padding:12px 8px}.summary strong{font-size:14px}.summary .small{font-size:12px}.toolbar{flex-wrap:wrap}.footer{left:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:10px}.footer .actions{width:100%}.footer .actions button{flex:1}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.record{padding:16px}.exp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.exp-grid .field{padding:12px}.search{max-width:none}dialog{padding:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><a href="#workspace" class="sr-only">跳至配置内容</a><div class="shell"><aside><div class="brand">玛法 <small>MIR II · 本地管理</small></div><div><p class="nav-label">数值配置</p><nav aria-label="配置分类" id="nav"></nav></div><div class="aside-foot">中国版 1.76 复刻<br>比奇省 · 开发中<br><a href="http://127.0.0.1:17600/" target="_blank" rel="noopener">打开游戏 ↗</a></div></aside><div class="main"><header class="topbar"><span>管理工作台 / <span id="crumb">升级经验</span></span><span class="local">本机服务 · 17080</span></header><main class="content" id="workspace"><div class="heading"><div><p class="eyebrow">比奇省 / 数值管理</p><h1 id="title">升级经验</h1><p class="description" id="description"></p></div><button id="reload">重新载入</button></div><div class="summary"><div><span class="small muted">配置来源</span><strong id="origin">正在载入</strong></div><div><span class="small muted">生效状态</span><strong id="applied">—</strong></div><div><span class="small muted">未保存字段</span><strong id="count">0 项</strong></div></div><p class="notice">原始候选基线保持只读。修改保存为本机自定义配置，重启游戏服务器后生效。</p><div class="toolbar"><h2 id="section-title">经验需求</h2><label class="search"><span class="sr-only">筛选配置</span><input id="search" type="search" placeholder="按等级、名称或坐标筛选" aria-label="筛选配置"></label></div><div id="records" aria-busy="true"></div><div class="pager" id="pager"></div><details class="sources"><summary>配置依据与只读来源</summary><p class="source-note">这些数据经过候选源码交叉核对，尚不能视作完整官服数值。仅开放已经接入的字段，素材编号、物种与来源记录不在此处修改。</p><pre id="sources"></pre></details></main><footer class="footer"><p id="status" role="status" aria-live="polite">正在连接本地服务…</p><div class="actions"><button id="restore" class="danger" disabled>恢复基线</button><button id="preview" class="primary" disabled>预览并保存</button></div></footer></div></div><dialog id="review" aria-labelledby="review-title"><h2 id="review-title">核对配置变更</h2><p id="review-note" class="muted"></p><div id="changes"></div><p id="review-error" role="alert" class="error"></p><div class="actions"><button id="cancel">返回编辑</button><button id="save" class="primary">确认保存</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v));
const sections={ground:{profile:'ground-items',name:'地面物品',desc:'分别设置普通掉落（包括金币）与玩家死亡掉出物品的消失时间。单位为分钟，重启后生效；30/120为当前Crystal运行默认值，尚未认证为1.76原值。归属保护时间是另一机制。'},experience:{profile:'experience',name:'升级经验',desc:'逐级查看并调整升级所需经验。当前仅校准至 50 级，未引入私服经验倍率。'},items:{profile:'jewellery',name:'首饰装备',desc:'管理已接入的 11 件首饰。基础属性与单件极品附加分开，持久沿用服务器原始单位。'},monsters:{profile:'bichon-wildlife',name:'怪物属性',desc:'当前开放鹿与稻草人。生命、攻击、经验和行动间隔由游戏服务器结算。'},respawns:{profile:'bichon-wildlife',name:'刷新配置',desc:'调整现有刷新组的坐标、范围、数量和周期。坐标范围为比奇地图 0–699。'},drops:{profile:'bichon-wildlife',name:'怪物掉落',desc:'每条掉落分别进行 1/N 判定，并非合计为 100% 的奖池。只修改分母，物品定义保持不变。'}};
const labels={price:'价格 · 金币',durability:'持久 · 原始值',weight:'重量',level:'佩戴等级',hp:'生命值',experience:'击杀经验',minDC:'攻击下限',maxDC:'攻击上限',accuracy:'准确',agility:'敏捷',moveMs:'移动间隔 · 毫秒',attackMs:'攻击间隔 · 毫秒',x:'横坐标 X',y:'纵坐标 Y',spread:'刷新范围 · 格',count:'刷新数量 · 只',minutes:'刷新周期 · 分钟',MaxDC:'攻击上限',MinDC:'攻击下限',MaxMC:'魔法上限',MinMC:'魔法下限',MaxSC:'道术上限',MinSC:'道术下限',MaxMAC:'魔御上限',MinMAC:'魔御下限',MaxAC:'防御上限',MinAC:'防御下限',Agility:'敏捷',Accuracy:'准确'};
const names={BichonScarecrow:'稻草人',BichonDeer:'鹿',BichonHealthSmall:'金创药（小量）',BichonManaSmall:'魔法药（小量）'};
let csrf='__CSRF__';
let section='experience',loaded='',original=null,draft=null,etag='',pending=false,custom=false,busy=false,generation=0,page=0,fields=[],reviewMode='save';const errors=new Map(),invalidValues=new Map();
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function get(obj,path){return path.reduce((o,k)=>o[k],obj)}function put(obj,path,value){let o=obj;path.slice(0,-1).forEach(k=>o=o[k]);o[path.at(-1)]=value;}
function changes(){return fields.filter(f=>get(original,f.path)!==get(draft,f.path)).map(f=>({label:f.title+' / '+f.label,before:get(original,f.path),after:get(draft,f.path)}));}
function dirty(){return !!original&&(JSON.stringify(original)!==JSON.stringify(draft)||errors.size>0)}
function state(message){if(message!==undefined)$('status').textContent=message;$('count').textContent=(original?changes().length:0)+' 项'+(errors.size?' · '+errors.size+' 项无效':'');$('preview').disabled=busy||!original||!changes().length||errors.size>0;$('restore').disabled=busy||!original||!custom;$('reload').disabled=busy;$('search').disabled=busy;document.querySelectorAll('#nav button').forEach(b=>b.disabled=busy);$('records').querySelectorAll('input').forEach(i=>i.disabled=busy);}
for(const [key,s] of Object.entries(sections)){const b=el('button');b.type='button';b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>';b.append(el('span',s.name));b.onclick=()=>navigate(key);b.dataset.section=key;$('nav').append(b);}
function allowDiscard(){return !dirty()||confirm('有未保存的修改，确定放弃并重新载入吗？');}
async function navigate(key){if(busy||key===section||!allowDiscard())return;section=key;page=0;$('search').value='';history.replaceState(null,'','#'+key);await load();}
async function load(){const request=++generation;busy=true;original=null;draft=null;fields=[];errors.clear();invalidValues.clear();const s=sections[section];$('title').textContent=$('crumb').textContent=$('section-title').textContent=s.name;$('description').textContent=s.desc;document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.section===section)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('records').replaceChildren(el('div','正在载入配置…','empty'));$('records').setAttribute('aria-busy','true');$('pager').replaceChildren();state('正在载入…');try{const r=await fetch('/admin/config/'+s.profile,{cache:'no-store'});if(!r.ok)throw Error('读取失败（'+r.status+'）');const d=await r.json();if(request!==generation)return;loaded=d.name;original=d.content;draft=clone(original);etag=d.etag;csrf=d.csrf??csrf;pending=d.pending;custom=d.custom;$('origin').textContent=custom?'本机自定义':'原始候选基线';$('applied').textContent=pending?'待重启生效':'当前已加载';const source={...original};for(const k of ['items','requiredExperience','monsters','respawns','drops','merchants'])delete source[k];$('sources').textContent=JSON.stringify(source,null,2);buildFields();render();state('已载入。修改后请先核对变更，再保存。');}catch(e){$('records').replaceChildren(el('div','配置载入失败，请点击「重新载入」重试。','empty'));$('origin').textContent='载入失败';$('applied').textContent='—';state(e.message);}finally{busy=false;$('records').setAttribute('aria-busy','false');state();}}
function buildFields(){fields=[];const add=(path,title,key,extra={})=>fields.push({path,title,label:labels[key]||key,min:['hp','count','minutes','moveMs','attackMs','required'].includes(key)?1:0,max:['x','y','spread'].includes(key)?699:['weight','level','accuracy','agility'].includes(key)?255:65535,...extra});
if(section==='ground'){add(['timers','ordinaryMinutes'],'普通掉落 · 物品与金币','消失时间 · 分钟',{min:1,max:10080});add(['timers','playerDeathMinutes'],'玩家死亡掉落 · 物品','消失时间 · 分钟',{min:1,max:10080});}
if(section==='experience')draft.requiredExperience.forEach((v,i)=>add(['requiredExperience',i],`${i+1} → ${i+2} 级`,'升级经验',{min:1,max:1e12}));
if(section==='items')draft.items.forEach((v,i)=>{for(const k of ['price','durability','weight','level'])add(['items',i,k],v.name,k);for(const k of Object.keys(v.stats))add(['items',i,'stats',k],v.name,k);});
if(section==='monsters')draft.monsters.forEach((v,i)=>{for(const k of ['hp','experience','minDC','maxDC','accuracy','agility','moveMs','attackMs'])add(['monsters',i,k],v.name,k);});
if(section==='respawns')draft.respawns.forEach((v,i)=>{for(const k of ['x','y','spread','count','minutes'])add(['respawns',i,k],`第 ${i+1} 组 · ${v.name}`,k);});
if(section==='drops')for(const [monster,list] of Object.entries(draft.drops))list.forEach((v,i)=>{const suffix=v.split(' ').slice(1).join(' '),name=suffix.startsWith('Gold ')?'金币 × '+suffix.slice(5):names[suffix]||suffix;add(['drops',monster,i],(names[monster]||monster)+' · '+name,'掉落分母 N',{min:1,max:99999999,drop:true,suffix});});}
function field(f){const wrap=el('label',undefined,'field'),key=JSON.stringify(f.path),input=el('input'),hint=el('small');wrap.append(el('span',section==='experience'?f.title:f.label));input.type='number';input.min=f.min;input.max=f.max;input.step=1;input.value=f.drop?get(draft,f.path).split(' ')[0].slice(2):get(draft,f.path);if(invalidValues.has(key))input.value=invalidValues.get(key);input.setAttribute('aria-label',f.title+' / '+f.label);input.id='field-'+fields.indexOf(f);hint.id=input.id+'-hint';input.setAttribute('aria-describedby',hint.id);const update=()=>{const err=errors.get(key);input.setAttribute('aria-invalid',String(!!err));input.classList.toggle('changed',get(original,f.path)!==get(draft,f.path));hint.className=err?'error':'';hint.textContent=err||(f.drop?'单次概率 '+(100/Number(input.value)).toLocaleString('zh-CN',{maximumFractionDigits:6})+'%':get(original,f.path)!==get(draft,f.path)?'载入值：'+get(original,f.path):f.path.at(-1)==='durability'?'1,000 原始值 = 1 点持久':'');};input.oninput=()=>{const n=Number(input.value);if(input.value===''||!Number.isSafeInteger(n)||n<f.min||n>f.max){errors.set(key,`请输入 ${f.min}–${f.max} 的整数`);invalidValues.set(key,input.value);}else{errors.delete(key);invalidValues.delete(key);put(draft,f.path,f.drop?'1/'+n+' '+f.suffix:n);}update();state(errors.size?'请先修正标出的无效数值。':'修改尚未保存。');};update();wrap.append(input,hint);return wrap;}
function render(){const query=$('search').value.trim().toLowerCase(),groups=[];for(const f of fields){let g=groups.find(g=>g.title===f.title);if(!g){g={title:f.title,fields:[]};groups.push(g)}g.fields.push(f)}const filtered=groups.filter(g=>(g.title+' '+g.fields.map(f=>String(get(draft,f.path))).join(' ')).toLowerCase().includes(query)),size=section==='experience'?20:section==='respawns'?8:12,total=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,total-1);const box=el('div',undefined,section==='experience'?'panel exp-grid':'records');filtered.slice(page*size,(page+1)*size).forEach(g=>{if(section==='experience'){box.append(field(g.fields[0]));return;}const card=el('article',undefined,'record');card.append(el('h3',g.title));const row=el('div',undefined,'fields');g.fields.forEach(f=>row.append(field(f)));card.append(row);box.append(card)});if(!filtered.length)box.append(el('p','没有匹配结果，试试其他名称、等级或坐标。','empty'));$('records').replaceChildren(box);$('pager').replaceChildren();if(total>1){const prev=el('button','上一页'),next=el('button','下一页');prev.disabled=page===0;next.disabled=page===total-1;prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};$('pager').append(prev,el('span',`${page+1} / ${total} · 共 ${filtered.length} 条`,'small muted'),next);}}
$('search').oninput=()=>{page=0;if(draft)render()};$('reload').onclick=()=>{if(allowDiscard())load()};window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
function review(restore=false){if(busy||!original)return;reviewMode=restore?'restore':'save';$('review-title').textContent=restore?'恢复当前配置的原始基线':'核对配置变更';$('review-note').textContent=restore?'仅恢复当前配置文件；同文件的其他分类也会恢复。现有配置会自动备份，重启服务器后生效。':'以下为相对于本次载入版本的修改。保存后需重启服务器生效。';$('review-error').textContent='';$('changes').replaceChildren();if(restore)$('changes').append(el('p','恢复范围：'+Object.values(sections).filter(s=>s.profile===loaded).map(s=>s.name).join('、')));else for(const c of changes()){const row=el('div',undefined,'change'),values=el('div',undefined,'values');row.append(el('strong',c.label));values.append(el('span',c.before),el('span','→'),el('b',c.after));row.append(values);$('changes').append(row)}$('save').textContent=restore?'确认恢复':'确认保存';$('save').disabled=false;$('review').showModal();$('cancel').focus();}
$('preview').onclick=()=>review();$('restore').onclick=()=>review(true);$('cancel').onclick=()=>$('review').close();$('review').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('save').onclick=async()=>{if(busy)return;busy=true;$('save').disabled=true;$('cancel').disabled=true;state('正在保存，请稍候…');try{const r=await fetch('/admin/config/'+loaded,{method:'POST',headers:{'Content-Type':'application/json','X-Mir-CSRF':csrf},body:JSON.stringify({etag,content:draft,restore:reviewMode==='restore'})});const d=await r.json();if(!r.ok)throw Error(d.message||'保存失败（'+r.status+'）');$('review').close();await load();state(reviewMode==='restore'?'已恢复基线，原配置已备份；重启服务器后生效。':'已保存自定义配置并备份旧值；重启服务器后生效。');}catch(e){$('review-error').textContent=e.message;state('保存未完成，编辑内容已保留。');}finally{busy=false;$('save').disabled=false;$('cancel').disabled=false;state();}};
if(sections[location.hash.slice(1)])section=location.hash.slice(1);load();
</script></body></html>
